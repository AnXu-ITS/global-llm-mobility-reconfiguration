# Experiment 1 — B2 (Optimization / Heuristic Manager) objective weights.
# FROZEN before any formal data collection (spec section 12).
#
# B2 minimizes the scalar objective J over the feasible candidate set
# (feasible air candidates + the ground-fallback candidate). Hard constraints
# (availability, battery/endurance, compatibility, landing-site availability,
# no equal/higher-priority preemption) are applied by the SAME candidate filter
# as B1 — B2 only changes the RANKING, never the safety envelope.
#
#   J = w1 * completion_time_s
#     + w_deadline * deadline_violation_s
#     + w2_priority[preempted_priority]          (only for REASSIGN/preemption)
#     + w3 * is_reassignment
#     + w_risk * risk_score
#
# Definitions (frozen; see reports/EXPERIMENT1_METRIC_DEFINITIONS.md):
#   completion_time_s      air ETA (DISPATCH/REASSIGN) or ground fallback ETA
#   deadline_violation_s   max(0, release_t + completion_time_s - deadline_s)
#   preempted_priority     priority of the busy mission being preempted (LOW/NORMAL/HIGH)
#   is_reassignment        1 if the action preempts a busy aircraft, else 0
#   risk_score             0/1/2 by endurance margin (>=120 / 60-120 / <60 s)
objective:
  w1_completion_time: 1.0          # s of completion time per unit
  w_deadline: 10.0                 # s of deadline violation per unit (strong)
  w2_existing_disruption:
    LOW: 20.0                      # s-equivalent disruption of a preempted LOW mission
    NORMAL: 40.0                   # s-equivalent disruption of a preempted NORMAL mission
    HIGH: 80.0                     # s-equivalent disruption of a preempted HIGH mission
    CRITICAL: 100000.0             # effectively forbidden (already filtered by B1 rule 3)
  w3_reassignment: 30.0            # fixed cost per preemption (count)
  w_risk: 10.0                     # per risk point
  risk_thresholds_s: [120.0, 60.0]  # >=120 -> 0, 60-120 -> 1, <60 -> 2
