   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.312049 48.706852)">COUPLED ENVIRONMENT</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(39.270565 63.545406)">SUMO roads + BlueSky air</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(34.127205 79.65607)">Missions, sites, disturbances</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(54.891385 95.815719)">1 s simulation clock</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(294.155799 48.706852)">GLOBAL SNAPSHOT</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(281.340447 64.465719)">Ground ETA and closures</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(269.442439 79.220406)">Air availability and endurance</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(271.982205 94.895406)">Mission priority and deadline</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(527.521306 48.706852)">SHARED CANDIDATES</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(511.187243 63.545406)">Legal air and ground options</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(517.88029 79.220406)">ETA, preemption, margins</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(518.367165 94.895406)">No policy-specific ranking</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(522.081071 209.367352)">SUPERVISORY DECISION</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(525.49736 224.205906)">B0 ground / B1 air-first</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(525.078767 239.880906)">B2 objective / B4b LLM</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(527.496071 256.476219)">One structured action</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(283.181072 209.367352)">CHECK AND EXECUTION</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(272.196697 225.126219)">Validate state and identifiers</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(282.023259 239.880906)">Issue or queue an action</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(270.189822 255.555906)">Supersede or reject if needed</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(50.102049 217.204852)">LOCAL CONTINGENCY</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(32.889237 232.043406)">Aircraft-level failure handling</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(30.025135 247.718406)">Independent of the supervisor</text>
   </g>
