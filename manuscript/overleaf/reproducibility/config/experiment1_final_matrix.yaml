# Experiment 1 — Ground Disruption and Selective Air Support
# Scenario core matrix (frozen before data collection).
#
# Factors:
#   A disruption severity: LOW (B2, +15.4%), MEDIUM (B1, +37.9%), HIGH (B1+B2, measured)
#   B mission urgency:     HIGH (slack 300 s), CRITICAL (slack 180 s)
#   C air workload:        low (2 idle medical UAV) / high (0 idle medical UAV)
#
# The emergency mission (medical blood, V2 -> V1) is released at
# mission_release_t_s; the ground disruption is applied at disruption_t_s.
# deadline_s = release_t + deadline_slack_s.
experiment1:
  version: 1
  duration_s: 900
  step_s: 1
  seed: 20240601
  mission_release_t_s: 300
  disruption_t_s: 300
  periodic_decision_s: 30          # event-triggered + 30 s periodic (frozen policy)
  emergency_mission:
    mission_id: M-EMERGENCY-001
    type: medical_blood
    origin: V2
    destination: V1
    ground_fallback: true

  disruptions:
    LOW:
      severity: LOW
      links: [B2]              # +15.43 % (measured in scenario_config)
    MEDIUM:
      severity: MEDIUM
      links: [B1]              # +37.87 % (measured in scenario_config)
    HIGH:
      severity: HIGH
      links: [B1, B2]          # +49.78 % from closure alone
      degrade_detour_factor: 0.5   # capacity degradation -> measured +73.41 %

  urgencies:
    HIGH:
      priority: HIGH
      deadline_slack_s: 300          # all ground ETAs (152-229 s) meet this -> air optional
      delay_cost: 20.0
      cancellation_cost: 200.0
    CRITICAL:
      priority: CRITICAL
      deadline_slack_s: 180          # MEDIUM(182s)/HIGH(229s) ground MISS; air(114.5s) meets
      delay_cost: 60.0
      cancellation_cost: 600.0

  # busy rows: (aircraft, mission_id, mission_type, mission_priority, origin, dest, reassignable)
  workloads:
    low:
      busy:
        - [L-UAV-01,  M-L-001, logistics,          NORMAL, V2, V3, false]
        - [EVTOL-01, M-P-001, passenger_transfer, NORMAL, V2, V1, false]
      idle: [M-UAV-01, M-UAV-02]
    high:
      busy:
        - [L-UAV-01,  M-L-001, logistics,          NORMAL, V2, V3, false]
        - [EVTOL-01, M-P-001, passenger_transfer, NORMAL, V2, V1, false]
        - [M-UAV-01, M-M-001, medical_transfer,   HIGH,   V1, V3, false]
        - [M-UAV-02, M-L-002, logistics,          NORMAL, V2, V1, true]
      idle: []

  scenarios:
    - {id: E1_H_C_low,  disruption: HIGH,   urgency: CRITICAL, workload: low,  tradeoff: air_clearly_useful}
    - {id: E1_H_C_high, disruption: HIGH,   urgency: CRITICAL, workload: high, tradeoff: borderline}
    - {id: E1_H_H_low,  disruption: HIGH,   urgency: HIGH,     workload: low,  tradeoff: unnecessary_air_or_useful}
    - {id: E1_H_H_high, disruption: HIGH,   urgency: HIGH,     workload: high, tradeoff: ground_preferable}
    - {id: E1_M_C_low,  disruption: MEDIUM, urgency: CRITICAL, workload: low,  tradeoff: air_useful}
    - {id: E1_M_C_high, disruption: MEDIUM, urgency: CRITICAL, workload: high, tradeoff: borderline}
    - {id: E1_M_H_low,  disruption: MEDIUM, urgency: HIGH,     workload: low,  tradeoff: borderline}
    - {id: E1_M_H_high, disruption: MEDIUM, urgency: HIGH,     workload: high, tradeoff: ground_preferable}
    - {id: E1_L_C_low,  disruption: LOW,    urgency: CRITICAL, workload: low,  tradeoff: borderline}
    - {id: E1_L_C_high, disruption: LOW,    urgency: CRITICAL, workload: high, tradeoff: ground_preferable}
    - {id: E1_L_H_low,  disruption: LOW,    urgency: HIGH,     workload: low,  tradeoff: unnecessary_air}
    - {id: E1_L_H_high, disruption: LOW,    urgency: HIGH,     workload: high, tradeoff: ground_preferable}

  # pilot scenarios (spec section 19)
  pilots:
    - {scenario: E1_H_C_low,  label: PILOT-A (air clearly beneficial)}
    - {scenario: E1_M_C_high, label: PILOT-B (borderline)}
    - {scenario: E1_L_H_high, label: PILOT-C (ground / preserving air preferable)}
